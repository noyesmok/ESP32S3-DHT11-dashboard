<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 IoT Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>

<body>
    <div class="dashboard">

        <div class="gauges">
            <div class="gauge-block">
                <h2>TEMPERATURE</h2>
                <canvas id="tempGauge" width="280" height="160"></canvas>
                <div id="tempValue" class="value">-- °C</div>
            </div>

            <div class="gauge-block">
                <h2>HUMIDITY</h2>
                <canvas id="humGauge" width="280" height="160"></canvas>
                <div id="humValue" class="value">-- %</div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stats-block">
                <h3>Temperature <span id="tempCount">40</span> readings</h3>
                <div class="stats-grid">
                    <div>
                        <div class="stats-label">Min</div>
                        <div id="tempMin" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Max</div>
                        <div id="tempMax" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Average</div>
                        <div id="tempAvg" class="stats-value">--</div>
                    </div>
                </div>
            </div>

            <div class="stats-block">
                <h3>Humidity <span id="humCount">40</span> readings</h3>
                <div class="stats-grid">
                    <div>
                        <div class="stats-label">Min</div>
                        <div id="humMin" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Max</div>
                        <div id="humMax" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Average</div>
                        <div id="humAvg" class="stats-value">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <h2>Temperature</h2>
            <canvas id="tempChart"></canvas>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
