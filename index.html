<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 IoT Dashboard</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div class="dashboard">
        <p id="status" class="status">Loading data...</p>

        <div class="gauges">
            <div class="gauge-block">
                <h2>TEMPERATURE</h2>
                <canvas id="tempGauge" width="280" height="160"></canvas>
                <div id="tempValue" class="value">-- &deg;C</div>
            </div>

            <div class="gauge-block">
                <h2>HUMIDITY</h2>
                <canvas id="humGauge" width="280" height="160"></canvas>
                <div id="humValue" class="value">-- %</div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stats-block">
                <h3>Temperature <span id="tempCount">40</span> readings</h3>
                <div class="stats-grid">
                    <div>
                        <div class="stats-label">Min</div>
                        <div id="tempMin" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Max</div>
                        <div id="tempMax" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Average</div>
                        <div id="tempAvg" class="stats-value">--</div>
                    </div>
                </div>
            </div>

            <div class="stats-block">
                <h3>Humidity <span id="humCount">40</span> readings</h3>
                <div class="stats-grid">
                    <div>
                        <div class="stats-label">Min</div>
                        <div id="humMin" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Max</div>
                        <div id="humMax" class="stats-value">--</div>
                    </div>
                    <div>
                        <div class="stats-label">Average</div>
                        <div id="humAvg" class="stats-value">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <h2>Temperature</h2>
            <canvas id="tempChart"></canvas>
        </div>
    </div>

    <script>
        function loadScript(src) {
            return new Promise(function (resolve, reject) {
                var s = document.createElement("script");
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        loadScript("https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js")
            .catch(function () {
                return loadScript("https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js");
            })
            .catch(function () {
                console.warn("Chart.js CDN failed; gauges/stats will still work");
            })
            .finally(function () {
                return loadScript("script.js?v=2");
            });
    </script>
</body>

</html>
